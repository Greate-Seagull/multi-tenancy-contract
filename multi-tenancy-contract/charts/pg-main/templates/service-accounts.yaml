{{- $created := dict }}
{{- range $fixed := list "app-migrator" "app-user" }}
{{- $_ := set $created $fixed true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fixed }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
{{- range $role, $cfg := .Values.roles }}
{{- $name := $role | replace "_" "-" }}
{{- $acc := (index ($.Values.access | default dict) $role) | default dict }}
{{- $sa := $acc.serviceAccount | default $name }}
{{- $namespaces := $acc.namespaces | default (list $.Release.Namespace) }}
{{- if and (has $.Release.Namespace $namespaces) (not (hasKey $created $sa)) }}
{{- $_ := set $created $sa true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
{{- end }}