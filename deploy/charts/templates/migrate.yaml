apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - {{- include "migrate.container" (dict "root" . "name" "migrate-contract" "locations" "filesystem:/flyway/sql/contract" "schema" .Values.migration.contractSchema) | nindent 10 }}
      containers:
        - {{- include "migrate.container" (dict "root" . "name" "migrate-service" "locations" "filesystem:/flyway/sql/service" "schema" (required "migration schema name is required" .Values.migration.serviceSchema)) | nindent 10 }}