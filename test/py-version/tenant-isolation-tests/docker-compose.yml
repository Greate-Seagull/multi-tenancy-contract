services:
  postgres:
    image: postgres:${PG_VERSION:-18-bookworm}
    environment:
      POSTGRES_USER: ${PGUSER:?}
      POSTGRES_PASSWORD: ${PGPASSWORD:?}
      POSTGRES_DB: ${PGDATABASE:?}
    ports:
      - "5432:5432"
    # DB chỉ phục vụ test: data nằm trên RAM, tắt các cơ chế bền vững cho nhanh
    tmpfs:
      - /var/lib/postgresql
    command: [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15