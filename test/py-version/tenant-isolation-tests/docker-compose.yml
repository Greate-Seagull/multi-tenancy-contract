services:
  postgres:
    image: postgres:${PG_VERSION:-18-bookworm}
    environment:
      POSTGRES_USER: ${PGUSER:?}
      POSTGRES_PASSWORD: ${PGPASSWORD:?}
      POSTGRES_DB: ${PGDATABASE:?}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:${PGPORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  flyway:
    image: flyway/flyway:11
    profiles: [ "tools" ]          # `docker compose up` sẽ không tự chạy service này
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${PGDATABASE:?}
      FLYWAY_USER: ${MIG_USER:?}
      FLYWAY_PASSWORD: ${MIG_PASSWORD:?}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ../../../contract/migrations:/flyway/sql:ro   # đường dẫn tính từ vị trí compose file