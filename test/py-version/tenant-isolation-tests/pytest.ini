[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --junitxml=reports/junit.xml

# Log hiển thị trực tiếp trên màn hình (mức INFO: đọc như một kịch bản)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-5s | %(message)s
log_cli_date_format = %H:%M:%S

# Log đầy đủ ra file (mức DEBUG: có cả từng câu SQL), ghi đè mỗi lần chạy
log_file = reports/latest.log
log_file_level = DEBUG
log_file_format = %(asctime)s.%(msecs)03d %(levelname)-5s %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    tc: gắn mã test case (TC-TBL-xx), mức ưu tiên, tiêu đề, kết quả mong đợi
    p0: test case ưu tiên P0
    p1: test case ưu tiên P1
    p2: test case ưu tiên P2
    p3: test case ưu tiên P3
    prv: nhóm PRV (phân quyền theo câu lệnh và vai trò)
