apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.dbNamespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  namespace: {{ .Values.dbNamespace }}
stringData:
  POSTGRES_PASSWORD: {{ .Values.passwords.admin | quote }}
    {{- range $role, $user := dict "admin" .Values.users.admin "migrator" .Values.users.migrator "app" .Values.users.app }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db-%s" $.Release.Namespace $role }}
  namespace: {{ $.Release.Namespace }}
stringData:
  username: {{ $user | quote }}
  password: {{ index $.Values.passwords $role | quote }}
    {{- end }}