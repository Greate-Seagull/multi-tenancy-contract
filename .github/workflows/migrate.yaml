name: tenant-contract-migrate

on:
  workflow_call:
    inputs:
      migration_path: { type: string, required: true }
      contract-ref: { type: string, default: v1.0.0 } # Ghim phiên bản
      runs-on: { type: string, default: ubuntu-latest } # Truyền runner
    secrets:

env:
  BOOT_IMAGE: ghcr.io/greate-seagull/db-bootstrap
  BASE_MIGRATION_IMAGE: ghcr.io/greate-seagull/db-migration
  SERVICE_MIGRATION_IMAGE: ghcr.io/${{ github.repository }}/db-migration

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ env.SERVICE_MIGRATION_IMAGE }}
    steps:
      - name: Checkout caller repo (migrations)
        uses: actions/checkout@v4

      - name: Checkout contract repo
        uses: actions/checkout@v4
        with:
          repository: https://github.com/Greate-Seagull/multi-tenancy-contract
          ref: ${{ inputs.contract-ref }}
          path: .contract

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

# Chuyển sang CI của repo gốc
#      - name: Build & push bootstrap
#        uses: docker/build-push-action@v6
#        with:
#          context: .contract/contract/bootstrap
#          push: true
#          tags: ${{ inputs.boot_image }}:${{ steps.meta.outputs.tag }}
#          cache-from: type=gha,scope=bootstrap
#          cache-to: type=gha,scope=bootstrap,mode=max

      - name: Build & push migration
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.migration-path }}
          file: .contract/contract/migration-service/Dockerfile
          build-args: |
            CONTRACT_IMAGE=${{ env.BASE_MIGRATION_IMAGE }}:${{ inputs.contract-ref }}
          push: true
          tags: ${{ env.SERVICE_MIGRATION_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,scope=migration,mode=max

