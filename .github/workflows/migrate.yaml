name: tenant-contract-migrate

on:
  workflow_call:
    inputs:
      migration-path: { type: string, required: true }
      contract-ref:   { type: string, default: v1.0.0 }
      runs-on:        { type: string, default: ubuntu-latest }

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions: { contents: read, packages: read }
    env:
      BOOT_IMAGE: ghcr.io/greate-seagull/tenant-bootstrap:${{ inputs.contract-ref }}
      MIGRATION_IMAGE: ghcr.io/greate-seagull/tenant-migration:${{ inputs.contract-ref }}
      TEST_IMAGE: ghcr.io/greate-seagull/tenant-test:${{ inputs.contract-ref }}
      SERVICE_IMAGE: service-migration:${{ github.sha }}
    steps:
      - name: Checkout caller repo (migrations)
        uses: actions/checkout@v4

      - name: Checkout contract repo
        uses: actions/checkout@v4
        with:
          repository: Greate-Seagull/multi-tenancy-contract # Chỉ nhận dạng <owner>/<repo>
          ref: ${{ inputs.contract-ref }}
          path: .contract

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build & load migration
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.migration-path }}
          file: .contract/contract/migration-service/Dockerfile
          build-args: |
            CONTRACT_IMAGE=${{ env.MIGRATION_IMAGE }}
          load: true
          tags: ${{ env.SERVICE_IMAGE }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,scope=migration,mode=max

      - uses: helm/kind-action@v1
        with: { cluster_name: test, kubectl_version: v1.31.0 }

      - name: Load image into kind
        run: kind load docker-image ${{ env.SERVICE_IMAGE }} --name test

      - name: Test deployment
        run: .contract/test/deploy/run.sh

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -A | tail -n 100

