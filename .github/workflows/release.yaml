name: release-contract-images

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'contract/**'
      - 'test/deploy/**'
      - 'deploy/**'
      - '.github/workflows/release.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bootstrap
            image: tenant-bootstrap
            context: contract/bootstrap
            file: contract/bootstrap/Dockerfile
          - name: migration
            image: tenant-migration
            context: contract/migration-base
            file: contract/migration-base/Dockerfile
          - name: test
            image: tenant-test
            context: .                      # Dockerfile COPY test/deploy/... và deploy/...
            file: test/deploy/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max