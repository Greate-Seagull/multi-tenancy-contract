name: release-contract-images

# Không build, không test lại: chỉ gắn tag phiên bản lên đúng image sha-<commit> mà CI trên master đã
# build, test, scan và attest. Tag đặt trên commit chưa có image thì workflow fail (tính năng).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false          # 1 image fail không chặn các image khác
      matrix:
        include:
          - image: tenant-bootstrap
            attested: true
          - image: tenant-migration
            attested: true
          - image: tenant-test
            attested: false     # không có attestation (xem ci.yaml)
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kiểm tra image của commit này tồn tại
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          src="ghcr.io/$owner/${{ matrix.image }}:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$src" > /dev/null 2>&1 || {
            echo "::error::Chưa có $src. Chờ CI trên master xanh cho commit $GITHUB_SHA rồi chạy lại release."
            exit 1
          }

      - name: Kiểm tra attestation trước promote
        if: matrix.attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          gh attestation verify "oci://ghcr.io/$owner/${{ matrix.image }}:sha-$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yaml" \
            --source-digest "$GITHUB_SHA"

      - name: Promote (gắn tag phiên bản, giữ nguyên digest)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx imagetools create \
            --tag "ghcr.io/$owner/${{ matrix.image }}:$GITHUB_REF_NAME" \
            "ghcr.io/$owner/${{ matrix.image }}:sha-$GITHUB_SHA"

      - name: Kiểm tra lại attestation trên tag phiên bản
        if: matrix.attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          gh attestation verify "oci://ghcr.io/$owner/${{ matrix.image }}:$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yaml" \
            --source-digest "$GITHUB_SHA"