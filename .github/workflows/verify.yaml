name: verify-contract

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'contract/**'
      - 'test/**'
      - '.github/workflows/verify.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: test/py-version/tenant-isolation-tests
    env:
      PG_VERSION: "18-bookworm"
      PGDATABASE: test
      PGUSER: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@v5   # nên pin SHA như checkout
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/py-version/tenant-isolation-tests/requirements.txt

      - run: pip install -r requirements.txt

      - name: Sinh password cho role
        run: |
          for v in APP_MIGRATOR_PASSWORD APP_USER_PASSWORD; do
            pw=$(openssl rand -hex 16)
            echo "::add-mask::$pw"
            echo "$v=$pw" >> "$GITHUB_ENV"
          done

      - name: Dựng Postgres
        run: docker compose up -d --wait

      - name: Setup role (bootstrap + password)
        run: python dbsetup.py

      - name: Chạy test
        env:
          ADMIN_USER=${{ env.PGUSER }}
          ADMIN_PASSWORD=${{ env.PGPASSWORD }}
        run: pytest -v

      - name: Log Postgres khi fail
        if: failure()
        run: docker compose logs postgres